<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 재설정 · UV</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--text:#e8e8e8;--text2:#b0b0b0;--text3:#707070;
        --border:#2a2a2a;--accent:#FFD700;--red:#e94560;--green:#27ae60}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);
       color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:min(420px,92vw)}
  h1{font-size:22px;margin-bottom:6px;text-align:center}
  h1 span{color:var(--accent);font-weight:800}
  .sub{color:var(--text3);font-size:13px;text-align:center;margin-bottom:26px;line-height:1.6}
  label{display:block;font-size:12px;color:var(--text3);margin-bottom:6px}
  input{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);
        border-radius:10px;color:var(--text);font-size:14px;outline:none;margin-bottom:14px}
  input:focus{border-color:var(--accent)}
  button{width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);
         color:#000;font-size:15px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .msg{margin-top:16px;font-size:13px;line-height:1.6;text-align:center;min-height:20px}
  .msg.err{color:var(--red)} .msg.ok{color:var(--green)} .msg.info{color:var(--text3)}
</style>
</head>
<body>
  <div class="box">
    <h1><span>UV</span> 비밀번호 재설정</h1>
    <p class="sub">새 비밀번호를 입력하세요.<br>완료 후 앱에서 이 비밀번호로 로그인합니다.</p>
    <form id="f">
      <label for="pw">새 비밀번호 (8자 이상)</label>
      <input type="password" id="pw" minlength="8" autocomplete="new-password" required>
      <label for="pw2">새 비밀번호 확인</label>
      <input type="password" id="pw2" minlength="8" autocomplete="new-password" required>
      <button type="submit" id="go">변경하기</button>
    </form>
    <div class="msg info" id="m">링크 확인 중...</div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // 이 페이지는 Supabase 복구 메일의 링크가 돌아오는 곳이다.
  // 링크에 담긴 복구 세션으로 본인 비밀번호만 바꾼다. 다른 권한은 없다.
  const sb = window.supabase.createClient(
    'https://dnflcjpjzqmrybtcleqy.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuZmxjanBqenFtcnlidGNsZXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0NTIyMjUsImV4cCI6MjA4OTAyODIyNX0._g01argDVGK1Wmm0GT-ThidWu33ls--IR-7F20_zJF8',
    { auth: { detectSessionInUrl: true, persistSession: false } }
  );
  const m = document.getElementById('m'), f = document.getElementById('f'), go = document.getElementById('go');
  const say = (t, c) => { m.textContent = t; m.className = 'msg ' + c; };

  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) { say('', 'info'); return; }
    // 해시가 아직 처리되기 전일 수 있어 한 번 더 본다
    sb.auth.onAuthStateChange((e, s) => { if (s) say('', 'info'); });
    setTimeout(async () => {
      const { data: { session: s2 } } = await sb.auth.getSession();
      if (!s2) { say('링크가 만료되었거나 올바르지 않습니다. 앱에서 다시 요청하세요.', 'err'); go.disabled = true; }
    }, 1500);
  })();

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
    if (pw !== pw2) { say('두 비밀번호가 일치하지 않습니다.', 'err'); return; }
    go.disabled = true; say('변경 중...', 'info');
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) { go.disabled = false; say('실패: ' + error.message, 'err'); return; }
    await sb.auth.signOut();
    f.style.display = 'none';
    say('변경되었습니다. 앱으로 돌아가 새 비밀번호로 로그인하세요.', 'ok');
  });
</script>
</body>
</html>
